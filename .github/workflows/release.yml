name: Release

# Push a tag like v1.2.3 to cut a release, or run this manually from the
# Actions tab. Publishes installers plus the latest.json the in-app updater
# polls.
#
# The release is created as a draft first and only published once every
# platform has uploaded, so users never see a half-finished release and the
# updater never reads a latest.json that is missing a platform.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: draft
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = process.env.RELEASE_TAG;
            // getReleaseByTag does not return drafts, so list instead. This
            // makes re-runs reuse the same release rather than duplicating it.
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { ...context.repo, per_page: 100 },
            );
            const existing = releases.find((release) => release.tag_name === tag);
            if (existing) {
              core.info(`Reusing release ${existing.id} for ${tag}`);
              return existing.id.toString();
            }
            const created = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `Stremo ${tag}`,
              body: 'Download an installer below. Installed apps update themselves automatically.',
              draft: true,
              prerelease: false,
            });
            return created.data.id.toString();

  build:
    needs: create-release
    strategy:
      fail-fast: false
      # Serialised so the two jobs cannot clobber each other's latest.json.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      # WebKitGTK and friends are only needed for the Linux bundle.
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential curl wget file \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Install dependencies
        run: npm ci

      # Decode / repair the secret so Tauri always sees a minisign key with
      # the `untrusted comment:` header. An empty password secret must not be
      # forwarded — that is the usual cause of:
      #   incorrect updater private key password: Missing comment in secret key
      - name: Prepare updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/prepare-updater-key.py

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SIGNALING_URL: ${{ vars.NEXT_PUBLIC_SIGNALING_URL }}
          NEXT_PUBLIC_WS_CONNECT_TOKEN: ${{ secrets.NEXT_PUBLIC_WS_CONNECT_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              make_latest: 'true',
            });
